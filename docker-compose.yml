services:

  library-db:
    image: postgres:16-alpine
    container_name: library-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /mnt/library/pgdata:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"   # локальный доступ, порт 5433 (не конфликтует с основным 5432)
    networks:
      - library-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 10s
      timeout: 5s
      retries: 10

  library-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: library-api
    restart: unless-stopped
    environment:
      DB_HOST: library-db
      DB_NAME: library
      DB_USER: library
      DB_PASSWORD: ${DB_PASSWORD}
      API_KEY: ${API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN}
      BASE_URL: https://library.optionsdata.ru
      CORS_ORIGIN: https://library.optionsdata.ru
      DEPLOY_CONTROL_DIR: /deploy-control
    volumes:
      - /mnt/library/content:/mnt/library/content
      # Models: whisper for speech, the embedding model for meaning search. Kept
      # out of the image on purpose — they are hundreds of megabytes, they change
      # on their own schedule, and an operator must be able to drop the files in
      # by hand on a server that cannot reach a model hub.
      - /mnt/library/models:/mnt/library/models
      # Shared "mailbox" with the host deploy-agent (see deploy-agent/README.md)
      - /mnt/library/app/deploy-control:/deploy-control
      # Live code. The deploy copies api/server.js and api/init.sql here and
      # restarts the container instead of rebuilding the image — so an ordinary
      # code change never touches a registry.
      #
      # A directory, not two file mounts, on purpose: git replaces a file by
      # writing a new one and renaming it over the old, which gives it a new
      # inode. A single-file bind mount follows the *old* inode, so the
      # container would keep serving the previous version while every deploy
      # reported success. Mounting the directory and copying into it in place
      # sidesteps that entirely.
      #
      # Empty on a fresh checkout — the container then runs the copy baked into
      # the image (see api/Dockerfile).
      - ./.api-live:/app/live:ro
    ports:
      - "127.0.0.1:3001:3001"   # только localhost, наружу не открыт
    depends_on:
      library-db:
        condition: service_healthy
    networks:
      - library-net

networks:
  library-net:
    name: library-net
    driver: bridge
